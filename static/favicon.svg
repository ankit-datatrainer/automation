<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Shield Shape -->
  <path d="M 32 10 L 48 16 C 48 30 40 44 32 52 C 24 44 16 30 16 16 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.9" 
        filter="url(#glow)" />

  <!-- Inner Shield Highlight -->
  <path d="M 32 13 L 45 18 C 45 29 38 41 32 48 C 26 41 19 29 19 18 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="1.5" />

  <!-- Globe Latitudes / Longitudes -->
  <circle cx="32" cy="27" r="10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <ellipse cx="32" cy="27" rx="5" ry="10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <line x1="22" y1="27" x2="42" y2="27" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Lightning / Automation Bolt -->
  <path d="M 34 16 L 26 30 L 32 30 L 29 42 L 39 27 L 33 27 Z" 
        fill="url(#accentGrad)" 
        filter="url(#glow)" />
</svg>
